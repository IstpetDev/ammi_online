<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <title>AmmiOnline - Sistema Educativo</title>
  <meta name="description" content="Plataforma educativa AmmiOnline para gestión de cursos, estudiantes y recursos académicos">
  <meta name="keywords" content="educación, plataforma educativa, cursos online, aprendizaje">
  <meta name="author" content="AmmiOnline">
  
  <meta property="og:title" content="AmmiOnline - Sistema Educativo">
  <meta property="og:description" content="Plataforma educativa para gestión de cursos y aprendizaje">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/images/og-image.png">
  
  <meta name="theme-color" content="#1976d2">
  <link rel="manifest" href="manifest.webmanifest">
  
  <link rel="icon" type="image/png" sizes="32x32" href="logo_ico.png">
  <link rel="apple-touch-icon" href="logo_ico.png">
  
  <base href="/">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>
<body>
  <app-root>
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Poppins, sans-serif;">
      <div style="text-align: center;">
        <img src="logo_ico.png" alt="AmmiOnline" style="width: 80px; margin-bottom: 20px; animation: pulse 1.5s ease-in-out infinite;">
        <h2 style="color: #1976d2; margin: 0;">Cargando AmmiOnline...</h2>
        <style>
          @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
          }
        </style>
      </div>
    </div>
  </app-root>
</body>
</html>
