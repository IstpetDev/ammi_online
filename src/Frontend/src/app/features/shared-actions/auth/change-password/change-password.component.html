<div class="change-password-container">
  <div class="change-password-card">
    <div class="back-to-home">
      <a routerLink="/dashboard" class="back-link">
        <i class="pi pi-arrow-left"></i>
        Volver al dashboard
      </a>
    </div>
    <h2>Cambiar Contraseña</h2>

    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="currentPassword">Contraseña Actual</label>
        <input
          type="password"
          id="currentPassword"
          formControlName="currentPassword"
          class="form-input"
          placeholder="Tu contraseña actual"
        >
        <div *ngIf="changePasswordForm.get('currentPassword')?.invalid && changePasswordForm.get('currentPassword')?.touched" class="error-message">
          Contraseña actual requerida
        </div>
      </div>

      <div class="form-group">
        <label for="newPassword">Nueva Contraseña</label>
        <input
          type="password"
          id="newPassword"
          formControlName="newPassword"
          class="form-input"
          placeholder="Tu nueva contraseña"
        >
        <div *ngIf="changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched" class="error-message">
          La nueva contraseña debe tener al menos 6 caracteres
        </div>
      </div>

      <div class="form-group">
        <label for="confirmNewPassword">Confirmar Nueva Contraseña</label>
        <input
          type="password"
          id="confirmNewPassword"
          formControlName="confirmNewPassword"
          class="form-input"
          placeholder="Confirma tu nueva contraseña"
        >
        <div *ngIf="changePasswordForm.get('confirmNewPassword')?.errors?.['mismatch'] && changePasswordForm.get('confirmNewPassword')?.touched" class="error-message">
          Las contraseñas no coinciden
        </div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="changePasswordForm.invalid">
        Cambiar Contraseña
      </button>
    </form>

    <div *ngIf="changePasswordError" class="error-message">
      {{ changePasswordError }}
    </div>

    <div *ngIf="changePasswordSuccess" class="success-message">
      {{ changePasswordSuccess }}
    </div>
  </div>
</div>
