<div class="login-container">
  <div class="login-card">
    <div class="back-to-home">
      <a routerLink="/" class="back-link">
        <i class="pi pi-arrow-left"></i>
        Volver al inicio
      </a>
    </div>
    <h2>Iniciar Sesión</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          formControlName="username"
          class="form-input"
          placeholder="Tu usuario"
        >
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="error-message">
          Usuario requerido
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-input"
          placeholder="Tu contraseña"
        >
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
          La contraseña debe tener al menos 6 caracteres
        </div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Iniciar Sesión</span>
        <p-progressSpinner *ngIf="isLoading" [style]="{width: '20px', height: '20px'}" strokeWidth="4" animationDuration="1s"></p-progressSpinner>
      </button>
    </form>

    <div *ngIf="loginError" class="error-message">
      {{ loginError }}
    </div>
  </div>
</div>
