<app-shared-toast></app-shared-toast>

<div class="seasons-container">

  <!-- Header -->
  <div class="settings-header">
    <div class="seasons-header-title">
      <h1>Regímenes Académicos</h1>
      <p>Clasifica los tipos de oferta educativa disponibles en la institución.</p>
    </div>
    <p-button label="Nuevo Régimen" icon="pi pi-plus" (onClick)="openCreateDialog()" styleClass="btn-nuevo"></p-button>
  </div>

  <!-- Tabla -->
  <div class="seasons-content-card">
    <p-table [value]="regimenes" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
             currentPageReportTemplate="{first}–{last} de {totalRecords} regímenes">
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre del régimen</th>
          <th style="width: 90px; text-align:center">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-regimen>
        <tr>
          <td class="col-primary">{{ regimen.detalle }}</td>
          <td class="seasons-actions-cell" style="justify-content:center">
            <p-button icon="pi pi-pencil" (onClick)="openEditDialog(regimen)" pTooltip="Editar" tooltipPosition="top"
                      styleClass="p-button-text p-button-rounded btn-edit p-button-sm"></p-button>
            <p-button icon="pi pi-trash" (onClick)="confirmDelete(regimen)" pTooltip="Eliminar" tooltipPosition="top"
                      styleClass="p-button-text p-button-rounded btn-delete p-button-sm"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="2">
            <div style="text-align:center; padding:3rem 1rem; color:var(--text-color-secondary)">
              <i class="pi pi-inbox" style="font-size:2rem; display:block; margin-bottom:0.5rem"></i>
              No hay regímenes registrados aún.
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>

<!-- Dialog para crear/editar regimen -->
<p-dialog [(visible)]="displayDialog" [modal]="true" [style]="{width: '600px'}" [header]="isEditing ? 'Editar Régimen' : 'Crear Régimen'"
          (onHide)="onHideDialog()" [draggable]="false" [resizable]="false" styleClass="p-dialog-custom">
  <div class="seasons-dialog-content">
    <form [formGroup]="regimenForm" (ngSubmit)="saveRegimen()" class="seasons-form-grid">
      <div class="seasons-form-row">
        <div class="seasons-form-group">
          <label for="detalle" class="seasons-form-label">Detalle</label>
          <input pInputText id="detalle" formControlName="detalle" class="seasons-form-control" />
        </div>
      </div>
      <div class="seasons-form-actions">
        <p-button label="Cancelar" icon="pi pi-times" type="button" (onClick)="displayDialog = false" class="p-button-secondary p-button-outlined"></p-button>
        <p-button label="Guardar" icon="pi pi-check" type="submit" [disabled]="!regimenForm.valid" class="p-button-primary"></p-button>
      </div>
    </form>
  </div>
</p-dialog>

<!-- Modal de confirmación para eliminar -->
<app-confirmation-modal
  [visible]="showConfirmDelete"
  title="Confirmar Eliminación"
  message="¿Está seguro de que desea eliminar este régimen?"
  acceptLabel="Eliminar"
  rejectLabel="Cancelar"
  (accept)="deleteRegimen()"
  (reject)="onRejectDelete()"
  (hide)="onRejectDelete()">
</app-confirmation-modal>

<app-shared-toast></app-shared-toast>
