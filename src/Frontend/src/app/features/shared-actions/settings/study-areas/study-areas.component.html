<div class="settings-page">

  <nav class="settings-tabs">
    <button class="settings-tab" [class.active]="activeTab === 'areas'" (click)="setActiveTab('areas')">
      <i class="pi pi-book"></i>
      Áreas
    </button>
    <button class="settings-tab" [class.active]="activeTab === 'areas-competencia'" (click)="setActiveTab('areas-competencia')">
      <i class="pi pi-star"></i>
      Áreas de Competencia
    </button>
  </nav>

  <div>
    <app-areas *ngIf="activeTab === 'areas'"></app-areas>
    <app-areas-competencia *ngIf="activeTab === 'areas-competencia'"></app-areas-competencia>
  </div>

</div>
