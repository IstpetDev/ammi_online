<div class="seasons-container">
  <!-- Header -->
  <div class="settings-header">
    <div class="seasons-header-title">
      <h1>Gestión de Áreas</h1>
      <p>Aquí se gestionarán las áreas de estudio.</p>
    </div>
    <p-button label="Nueva Área" icon="pi pi-plus" (onClick)="openCreateDialog()" styleClass="btn-nuevo"></p-button>
  </div>

  <div class="seasons-content-card">
    <p-table [value]="areas" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} áreas">
      <ng-template pTemplate="header">
        <tr>
          <th>Detalle</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-area>
        <tr>
          <td class="col-primary">{{ area.detalle }}</td>
          <td class="seasons-actions-cell" style="justify-content:center">
            <p-button icon="pi pi-pencil" (onClick)="openEditDialog(area)" pTooltip="Editar" tooltipPosition="top"
              styleClass="p-button-text p-button-rounded btn-edit p-button-sm"></p-button>
            <p-button icon="pi pi-trash" (onClick)="confirmDelete(area)" pTooltip="Eliminar" tooltipPosition="top"
              styleClass="p-button-text p-button-rounded btn-delete p-button-sm"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="2">
            <div style="text-align:center; padding:3rem 1rem; color:var(--text-color-secondary)">
              <i class="pi pi-inbox" style="font-size:2rem; display:block; margin-bottom:0.5rem"></i>
              No hay áreas registradas aún.
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Dialog para crear/editar área -->
<p-dialog [(visible)]="displayDialog" [modal]="true" [style]="{width: '480px'}"
  [header]="isEditing ? 'Editar Área' : 'Nueva Área'" (onHide)="hideDialog()" [draggable]="false" [resizable]="false">
  <form [formGroup]="areaForm">
    <div class="p-fluid formgrid grid" style="padding-top: 0.5rem;">
      <div class="field col-12">
        <label class="font-semibold block mb-2">Detalle <span class="text-red-400">*</span></label>
        <input pInputText formControlName="detalle" placeholder="Nombre del área" style="width:100%" />
      </div>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <p-button label="Cancelar" icon="pi pi-times" (onClick)="hideDialog()" [text]="true"
      severity="secondary"></p-button>
    <p-button label="Guardar" icon="pi pi-check" (onClick)="saveArea()" [disabled]="!areaForm.valid"></p-button>
  </ng-template>
</p-dialog>

<!-- Modal de confirmación para eliminar -->
<app-confirmation-modal [visible]="showConfirmDelete" title="Confirmar Eliminación"
  message="¿Está seguro de que desea eliminar esta área?" acceptLabel="Eliminar" rejectLabel="Cancelar"
  (accept)="deleteArea()" (reject)="cancelDelete()" (hide)="cancelDelete()">
</app-confirmation-modal>

<app-shared-toast></app-shared-toast>
