<div class="seasons-container">
  <div class="seasons-header">
    <div class="seasons-header-content">
      <div class="seasons-header-title">
        <h1>Gestión de Áreas de Competencia</h1>
        <p>Aquí se gestionarán las áreas de competencia.</p>
      </div>
      <div class="seasons-header-actions">
        <p-button label="Agregar Área de Competencia" icon="pi pi-plus" (onClick)="openCreateDialog()" styleClass="p-button-primary p-button-lg"></p-button>
      </div>
    </div>
  </div>

  <div class="seasons-content-card">
    <p-table [value]="areasCompetencia" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
             currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} áreas de competencia">
      <ng-template pTemplate="header">
        <tr>
          <th>Detalle</th>
          <th>Área</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-areaCompetencia>
        <tr>
          <td>{{ areaCompetencia.detalle }}</td>
          <td>{{ getAreaName(areaCompetencia.idArea) }}</td>
          <td class="seasons-actions-cell">
            <p-button icon="pi pi-pencil" (onClick)="openEditDialog(areaCompetencia)" pTooltip="Editar" tooltipPosition="top" styleClass="p-button-rounded p-button-text p-button-sm"></p-button>
            <p-button icon="pi pi-trash" (onClick)="confirmDelete(areaCompetencia)" pTooltip="Eliminar" tooltipPosition="top" styleClass="p-button-rounded p-button-text p-button-sm"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3">No hay áreas de competencia registradas.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Dialog para crear/editar área de competencia -->
<p-dialog [(visible)]="displayDialog" [modal]="true" [style]="{width: '600px'}" [header]="isEditing ? 'Editar Área de Competencia' : 'Crear Área de Competencia'"
          (onHide)="hideDialog()" [draggable]="false" [resizable]="false" styleClass="p-dialog-custom">
  <div class="seasons-dialog-content">
    <form [formGroup]="areaCompetenciaForm" (ngSubmit)="saveAreaCompetencia()" class="seasons-form-grid">
      <div class="seasons-form-row">
        <div class="seasons-form-group">
          <label for="detalle" class="seasons-form-label">Detalle</label>
          <input pInputText id="detalle" formControlName="detalle" class="seasons-form-control" />
        </div>
      </div>
      <div class="seasons-form-row">
        <div class="seasons-form-group">
          <label for="idArea" class="seasons-form-label">Área</label>
          <select id="idArea" formControlName="idArea" class="seasons-form-control">
            <option value="">Seleccione un área</option>
            <option *ngFor="let area of areas" [value]="area.idArea">{{ area.detalle }}</option>
          </select>
        </div>
      </div>
      <div class="seasons-form-actions">
        <p-button label="Cancelar" icon="pi pi-times" type="button" (onClick)="displayDialog = false" class="p-button-secondary p-button-outlined"></p-button>
        <p-button label="Guardar" icon="pi pi-check" type="submit" [disabled]="!areaCompetenciaForm.valid" class="p-button-primary"></p-button>
      </div>
    </form>
  </div>
</p-dialog>

<!-- Modal de confirmación para eliminar -->
<app-confirmation-modal
  [visible]="showConfirmDelete"
  title="Confirmar Eliminación"
  message="¿Está seguro de que desea eliminar esta área de competencia?"
  acceptLabel="Eliminar"
  rejectLabel="Cancelar"
  (accept)="deleteAreaCompetencia()"
  (reject)="cancelDelete()"
  (hide)="cancelDelete()">
</app-confirmation-modal>

<p-toast></p-toast>
