<div class="p-4">
  <div class=" ">
    <form [formGroup]="plantillaForm" (ngSubmit)="onSubmit()">
      <!-- Nombre -->
      <div class="field mb-4">
        <label for="nombre" class="block mb-2 font-semibold">Nombre <span class="text-red-500">*</span></label>
        <input pInputText id="nombre" formControlName="nombre"
               class="w-full" placeholder="Ej: Evaluación Trimestral 2024"
               [ngClass]="{'ng-invalid ng-dirty': plantillaForm.get('nombre')?.invalid && plantillaForm.get('nombre')?.touched}" />
        <small *ngIf="plantillaForm.get('nombre')?.invalid && plantillaForm.get('nombre')?.touched" class="p-error block mt-1">
          <span *ngIf="plantillaForm.get('nombre')?.errors?.['required']">El nombre es requerido</span>
          <span *ngIf="plantillaForm.get('nombre')?.errors?.['minlength']">Mínimo 3 caracteres</span>
          <span *ngIf="plantillaForm.get('nombre')?.errors?.['maxlength']">Máximo 100 caracteres</span>
        </small>
      </div>

      <!-- Detalle -->
      <div class="field mb-4">
        <label for="detalle" class="block mb-2 font-semibold">Descripción</label>
        <textarea pTextarea id="detalle" formControlName="detalle"
                  [rows]="3" class="w-full"
                  placeholder="Descripción de la plantilla..."
                  [autoResize]="true"></textarea>
         <small *ngIf="plantillaForm.get('detalle')?.invalid" class="p-error block mt-1">
          <span *ngIf="plantillaForm.get('detalle')?.errors?.['maxlength']">Máximo 500 caracteres</span>
        </small>
      </div>

      <!-- Estado -->


    </form>
  </div>
</div>
