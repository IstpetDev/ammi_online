<div class="w-full p-4">
  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center">
      <p-button icon="pi pi-arrow-left" [rounded]="true" [text]="true"
                (onClick)="onBack()"></p-button>
      <div class="ml-2">
        <h1 class="text-2xl font-bold text-[var(--text-color)]">Configurar Estructura</h1>
        <p class="text-gray-500">{{ plantilla.nombre }}</p>
      </div>
    </div>
    
    <div class="flex gap-2">
      <p-button label="Agregar Nodo Raíz" icon="pi pi-plus" 
                (onClick)="onAddNode({ parentId: null })"></p-button>
    </div>
  </div>

  <!-- Validacion -->
  <app-validacion-pesos [validacion]="validacion"></app-validacion-pesos>

  <!-- Arbol -->
  <div class="card p-4 bg-[var(--surface-card)] rounded-lg shadow overflow-x-auto">
    <app-estructura-tree [estructura]="estructura" 
                         [tiposEstructura]="tiposEstructura"
                         [loading]="loading"
                         (addNode)="onAddNode($event)"
                         (editNode)="onEditNode($event)"
                         (deleteNode)="onDeleteNode($event)">
    </app-estructura-tree>
  </div>
</div>

<!-- Dialog Formulario de Nodo -->
<app-nodo-form [(visible)]="showNodoDialog"
               [nodo]="editingNodo"
               [idPlantillaEvaluacion]="plantilla.idPlantillaEvaluacion"
               [idNodoPadre]="currentParentId"
               [tiposEstructura]="tiposEstructura"
               [tiposReglaCalculo]="tiposReglaCalculo"
               [reglaExistente]="reglaExistenteNodo"
               [ordenSugerido]="ordenSugerido"
               (save)="onNodeSave($event)"
               (cancel)="onNodeCancel()">
</app-nodo-form>
