<app-shared-drawer
  [(visible)]="visible"
  [title]="title"
  [mode]="'modal'"
  [size]="'md'"
  (close)="onCancel()">

  <form [formGroup]="nodoForm" (ngSubmit)="onSubmit()" class="p-fluid">

    <!-- Nombre del Nodo -->
    <div class="field mb-4">
      <label for="nodoNombre" class="block mb-2 font-semibold">Nombre <span class="text-red-500">*</span></label>
      <input pInputText id="nodoNombre" formControlName="nodoNombre" autofocus
             placeholder="Ej: Primer Parcial, Examen Final"
             [ngClass]="{'ng-invalid ng-dirty': nodoForm.get('nodoNombre')?.invalid && nodoForm.get('nodoNombre')?.touched}" />
      <small *ngIf="nodoForm.get('nodoNombre')?.invalid && nodoForm.get('nodoNombre')?.touched" class="p-error block">
        El nombre es requerido (min 2 caracteres)
      </small>
    </div>

    <!-- Tipo de Nodo -->
    <div class="field mb-4">
      <label for="tipo" class="block mb-2 font-semibold">Tipo de Componente <span class="text-red-500">*</span></label>
      <p-select id="tipo"
                [options]="tiposEstructura"
                optionLabel="detalle"
                optionValue="idTipoPlantillaEstrucutra"
                formControlName="idTipoPlantillaEstructura"
                placeholder="Seleccione un tipo"
                [showClear]="true"
                appendTo="body">
        <ng-template pTemplate="selectedItem" let-selected>
          <span *ngIf="selected">{{ selected.detalle }}</span>
        </ng-template>
        <ng-template pTemplate="item" let-tipo>
          <span>{{ tipo.detalle }}</span>
        </ng-template>
      </p-select>
      <small *ngIf="nodoForm.get('idTipoPlantillaEstructura')?.invalid && nodoForm.get('idTipoPlantillaEstructura')?.touched" class="p-error block">
        El tipo es requerido
      </small>
      <small class="block mt-1" style="color: var(--text-color-secondary);">
        No hay tipos disponibles. Verifique la conexion con el servidor.
      </small>
    </div>

    <div class="formgrid grid">
      <!-- Peso -->
      <div class="field col-6">
        <label for="peso" class="block mb-2 font-semibold">Peso (%) <span class="text-red-500">*</span></label>
        <p-inputNumber id="peso" formControlName="peso" suffix="%"
                       [min]="0" [max]="100"
                       [minFractionDigits]="0" [maxFractionDigits]="2"
                       mode="decimal"></p-inputNumber>
      </div>

      <!-- Orden -->
      <div class="field col-6">
        <label for="orden" class="block mb-2 font-semibold">Orden <span class="text-red-500">*</span></label>
        <p-inputNumber id="orden" formControlName="orden" [min]="1" [showButtons]="true"></p-inputNumber>
      </div>
    </div>

    <!-- Separador -->
    <p-divider align="left" *ngIf="tiposReglaCalculo.length > 0">
      <span class="text-sm text-gray-500">Regla de Calculo (Opcional)</span>
    </p-divider>

    <!-- Configurar Regla de Calculo -->
    <div class="field mb-4" *ngIf="tiposReglaCalculo.length > 0">
      <div class="flex align-items-center gap-2">
        <p-checkbox formControlName="configurarRegla" [binary]="true" inputId="configurarRegla"></p-checkbox>
        <label for="configurarRegla" class="cursor-pointer">Configurar regla de calculo para este nodo</label>
        <span pTooltip="Las reglas de calculo definen como se calcularan las notas de nodos padre a partir de sus hijos"
              tooltipPosition="top"
              class="icon-helper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-20">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
        </span>
      </div>
    </div>

    <!-- Campos de Regla (condicional) -->
    <div *ngIf="configurarRegla && tiposReglaCalculo.length > 0" class="p-3 bg-gray-50 rounded-lg mb-4">

      <!-- Tipo de Regla -->
      <div class="field mb-3">
        <label for="tipoRegla" class="block mb-2 font-semibold">Tipo de Calculo <span class="text-red-500">*</span></label>
        <p-select id="tipoRegla"
                  [options]="tiposReglaCalculo"
                  optionLabel="detalle"
                  optionValue="idTipoReglaCalculo"
                  formControlName="idTipoReglaCalculo"
                  placeholder="Seleccione tipo de calculo"
                  appendTo="body">
        </p-select>
      </div>

      <div class="formgrid grid">
        <!-- Nota Minima Aprobar -->
        <div class="field col-6">
          <label for="notaAprobar" class="block mb-2 font-semibold">Nota Min. Aprobar</label>
          <p-inputNumber id="notaAprobar" formControlName="notaMinimaAprobar"
                         [min]="0" [max]="10"
                         [minFractionDigits]="2" [maxFractionDigits]="2"
                         mode="decimal"></p-inputNumber>
        </div>

        <!-- Nota Minima Recuperar -->
        <div class="field col-6">
          <label for="notaRecuperar" class="block mb-2 font-semibold">Nota Min. Recuperar</label>
          <p-inputNumber id="notaRecuperar" formControlName="notaMinimaRecuperar"
                         [min]="0" [max]="10"
                         [minFractionDigits]="2" [maxFractionDigits]="2"
                         mode="decimal"></p-inputNumber>
        </div>
      </div>

      <small style="color: var(--text-color-secondary);" class="block mt-2">
        Los estudiantes con notas menores a "Min. Recuperar" reprobaran directamente.
      </small>
    </div>

  </form>

  <div drawer-footer>
    <button type="button" class="btn-drawer btn-drawer-cancel" (click)="onCancel()">
      Cancelar
    </button>
    <button type="submit" class="btn-drawer btn-drawer-confirm" (click)="onSubmit()" [disabled]="nodoForm.invalid">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="btn-icon-svg">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Guardar
    </button>
  </div>
</app-shared-drawer>
