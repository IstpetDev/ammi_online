<app-shared-toast></app-shared-toast>

<app-plantilla-list
  (create)="showCreate()"
  (edit)="showEdit($event)"
  (configure)="showConfigure($event)">
</app-plantilla-list>

<!-- Modal para crear/editar plantilla -->
<app-shared-modal
  [(visible)]="showFormDialog"
  [title]="(isEditing ? 'Editar' : 'Nueva') + ' Plantilla de Evaluación'"
  [size]="'lg'"
  cancelText="Cancelar"
  confirmText="Guardar"
  (close)="closeFormDialog()"
  (confirm)="submitForm()">
  <app-plantilla-form
    [plantilla]="selectedPlantilla"
    [isEditing]="isEditing"
    (save)="onFormSave()"
    (cancel)="closeFormDialog()">
  </app-plantilla-form>
</app-shared-modal>

<!-- Drawer para configurar estructura -->
<app-shared-drawer
  [(visible)]="showConfigureDialog"
  title="Configurar Estructura de Plantilla"
  [mode]="'drawer'"
  [position]="'right'"
  [size]="'xl'"
  [showFooter]="false"
  (close)="closeConfigureDialog()">
  <app-configurar-plantilla
    *ngIf="selectedPlantilla"
    [plantilla]="selectedPlantilla"
    (back)="closeConfigureDialog()">
  </app-configurar-plantilla>
</app-shared-drawer>
