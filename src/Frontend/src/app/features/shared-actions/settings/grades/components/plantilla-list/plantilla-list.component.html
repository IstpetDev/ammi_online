<div class="seasons-container">
  <app-shared-toast></app-shared-toast>
  
  <!-- Header -->
  <div class="settings-header">
    <div class="seasons-header-title">
      <h2>Plantillas de Evaluación</h2>
      <p>Gestión de modelos de evaluación y sus estructuras.</p>
    </div>
    <button class="btn-nuevo" (click)="onCreate()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
        <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      Nueva Plantilla
    </button>
  </div>

  <div class="mb-4">
    <p-selectButton [options]="filtroOptions" [(ngModel)]="filtroActivo"
                    (onChange)="onFiltroChange()"></p-selectButton>
  </div>

  <div class="seasons-content-card">
    <app-shared-table
      [columns]="tableColumns"
      [data]="paginatedPlantillas"
      [loading]="loading"
      [totalRecords]="plantillas.length"
      [rowsPerPage]="rowsPerPage"
      [page]="currentPage"
      [paginator]="true"
      (pageChange)="onPageChange($event)">

      <ng-template stColTemplate="nombre" let-row="row">
        <span class="col-primary">{{ row.nombre }}</span>
      </ng-template>

      <ng-template stColTemplate="estado" let-row="row">
        <p-tag [severity]="row.esActivo ? 'success' : 'danger'"
               [value]="row.esActivo ? 'Activa' : 'Inactiva'"></p-tag>
      </ng-template>

      <ng-template stColTemplate="acciones" let-row="row">
        <div class="seasons-actions-cell">
          <button class="btn-icon-action" (click)="onEdit(row)" title="Editar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
            </svg>
          </button>
          <button class="btn-icon-action" (click)="onConfigure(row)" title="Configurar Estructura">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" /><rect x="3" y="14" width="7" height="7" />
            </svg>
          </button>
          <button class="btn-icon-action" (click)="onDuplicate(row)" title="Duplicar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
          </button>
          <button class="btn-icon-action btn-icon-danger" (click)="onDelete(row)" title="Eliminar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              <line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" />
            </svg>
          </button>
        </div>
      </ng-template>
    </app-shared-table>
  </div>
</div>

<!-- Modal de confirmación -->
<app-confirmation-modal [visible]="showConfirmDelete"
                        title="Confirmar Eliminación"
                        [message]="mensajeConfirmacion"
                        (confirm)="confirmDelete()"
                        (cancel)="cancelDelete()">
</app-confirmation-modal>

<!-- Modal de duplicar -->
<app-shared-drawer
  [(visible)]="showDuplicateDialog"
  title="Duplicar Plantilla"
  [mode]="'modal'"
  [size]="'sm'"
  [cancelText]="'Cancelar'"
  [confirmText]="'Duplicar'"
  [confirmLoading]="duplicating"
  [confirmDisabled]="!nuevoNombreDuplicado.trim()"
  (cancel)="cancelDuplicate()"
  (confirm)="confirmDuplicate()"
  (close)="cancelDuplicate()">
  <div class="p-fluid">
    <div class="field">
      <label for="nuevoNombre" class="block mb-2 font-semibold">Nombre de la nueva plantilla</label>
      <input pInputText id="nuevoNombre" [(ngModel)]="nuevoNombreDuplicado" autofocus class="w-full" />
      <small class="text-gray-500 block mt-1">Se creará una copia idéntica de la estructura.</small>
    </div>
  </div>
</app-shared-drawer>
