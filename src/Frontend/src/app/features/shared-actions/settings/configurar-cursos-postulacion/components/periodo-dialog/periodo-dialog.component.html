<app-shared-modal [(visible)]="visible"
  [title]="editando ? 'Editar Periodo' : 'Nuevo Periodo Lectivo'" customWidth="450px" [showFooter]="true"
  cancelText="Cancelar" confirmText="Guardar" [confirmDisabled]="!formDetalle.trim() || !formFechaInicio || !formFechaFin || guardando"
  (confirm)="guardar()" (cancel)="close()">
  <div class="ccp-dialog-body">
    <div class="form-group">
      <label>Nombre del periodo <span class="required">*</span></label>
      <input type="text" class="form-control" [ngModel]="formDetalle" (ngModelChange)="formDetalle = $event ? $event.toUpperCase() : ''" placeholder="Ej. 2026-2027" style="text-transform: uppercase;">
    </div>
    <div class="form-group">
      <label>Fecha inicio <span class="required">*</span></label>
      <input type="date" class="form-control" [(ngModel)]="formFechaInicio">
    </div>
    <div class="form-group">
      <label>Fecha fin <span class="required">*</span></label>
      <input type="date" class="form-control" [(ngModel)]="formFechaFin">
    </div>
  </div>
</app-shared-modal>
