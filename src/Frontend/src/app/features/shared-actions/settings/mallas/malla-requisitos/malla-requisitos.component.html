<div class="seasons-container">
  <div class="seasons-header">
    <div class="seasons-header-content">
      <div class="seasons-header-title">
        <h1>Gestión de Malla Requisitos</h1>
        <p>Aquí se gestionarán las relaciones entre mallas y requisitos.</p>
      </div>
      <div class="seasons-header-actions">
        <p-button label="Agregar Malla Requisito" icon="pi pi-plus" (onClick)="openCreateDialog()" styleClass="p-button-primary p-button-lg"></p-button>
        <p-button label="Asignación Masiva" icon="pi pi-copy" (onClick)="openMassiveDialog()" styleClass="p-button-secondary p-button-lg"></p-button>
        <p-button label="Replicar Malla" icon="pi pi-clone" (onClick)="openReplicateDialog()" styleClass="p-button-info p-button-lg"></p-button>
      </div>
    </div>
  </div>

  <div class="seasons-content-card">
    <p-table [value]="mallaRequisitos" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
             currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} malla requisitos">
      <ng-template pTemplate="header">
        <tr>
          <th>Malla</th>
          <th>Requisito</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-mallaRequisito>
        <tr>
          <td>{{ mallaRequisito.detalleMalla }}</td>
          <td>{{ mallaRequisito.detalleRequisito }}</td>
          <td class="seasons-actions-cell">
            <p-button icon="pi pi-trash" (onClick)="confirmDelete(mallaRequisito)" pTooltip="Eliminar" tooltipPosition="top" styleClass="p-button-rounded p-button-text p-button-sm"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3">No hay malla requisitos registrados.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Dialog para crear malla requisito -->
<p-dialog [(visible)]="displayDialog" [modal]="true" [style]="{width: '600px'}" [header]="'Crear Malla Requisito'"
          (onHide)="hideDialog()" [draggable]="false" [resizable]="false" styleClass="p-dialog-custom">
  <div class="seasons-dialog-content">
    <form [formGroup]="mallaRequisitoForm" (ngSubmit)="saveMallaRequisito()" class="seasons-form-grid">
      <div class="seasons-form-row">
        <div class="seasons-form-group">
          <label for="idMalla" class="seasons-form-label">Malla</label>
          <select
            id="idMalla"
            formControlName="idMalla"
            class="seasons-form-control">
            <option value="">Seleccione una malla</option>
            <option *ngFor="let malla of mallas" [value]="malla.idMalla">{{ malla.detalle }}</option>
          </select>
        </div>
        <div class="seasons-form-group">
          <label for="idRequisito" class="seasons-form-label">Requisito</label>
          <select
            id="idRequisito"
            formControlName="idRequisito"
            class="seasons-form-control">
            <option value="">Seleccione un requisito</option>
            <option *ngFor="let requisito of requisitos" [value]="requisito.idRequisitos">{{ requisito.detalle }}</option>
          </select>
        </div>
      </div>
      <div class="seasons-form-actions">
        <p-button label="Cancelar" icon="pi pi-times" type="button" (onClick)="hideDialog()" class="p-button-secondary p-button-outlined"></p-button>
        <p-button label="Guardar" icon="pi pi-check" type="submit" [disabled]="!mallaRequisitoForm.valid" class="p-button-primary"></p-button>
      </div>
    </form>
  </div>
</p-dialog>

<!-- Dialog para asignación masiva -->
<p-dialog [(visible)]="displayMassiveDialog" [modal]="true" [style]="{width: '600px'}" [header]="'Asignación Masiva de Requisitos'"
          (onHide)="hideMassiveDialog()" [draggable]="false" [resizable]="false" styleClass="p-dialog-custom">
  <div class="seasons-dialog-content">
    <form [formGroup]="massiveForm" (ngSubmit)="saveMassiveAssignment()" class="seasons-form-grid">
      <div class="seasons-form-row">
        <div class="seasons-form-group">
          <label for="idMalla" class="seasons-form-label">Malla</label>
          <select
            id="idMalla"
            formControlName="idMalla"
            class="seasons-form-control">
            <option value="">Seleccione una malla</option>
            <option *ngFor="let malla of mallas" [value]="malla.idMalla">{{ malla.detalle }}</option>
          </select>
        </div>
      </div>
      <div class="seasons-form-row">
        <div class="seasons-form-group">
          <label for="requisitoIds" class="seasons-form-label">Requisitos</label>
          <p-multiSelect
            formControlName="requisitoIds"
            [options]="requisitosOptions"
            optionLabel="label"
            optionValue="value"
            placeholder="Seleccione requisitos"
            [appendTo]="'body'"
            class="seasons-form-control">
          </p-multiSelect>
        </div>
      </div>
      <div class="seasons-form-actions">
        <p-button label="Cancelar" icon="pi pi-times" type="button" (onClick)="hideMassiveDialog()" class="p-button-secondary p-button-outlined"></p-button>
        <p-button label="Asignar" icon="pi pi-check" type="submit" [disabled]="!massiveForm.valid" class="p-button-primary"></p-button>
      </div>
    </form>
  </div>
</p-dialog>

<!-- Dialog para replicar malla -->
<p-dialog [(visible)]="displayReplicateDialog" [modal]="true" [style]="{width: '600px'}" [header]="'Replicar Requisitos de Malla'"
          (onHide)="hideReplicateDialog()" [draggable]="false" [resizable]="false" styleClass="p-dialog-custom">
  <div class="seasons-dialog-content">
    <form [formGroup]="replicateForm" (ngSubmit)="saveReplicate()" class="seasons-form-grid">
      <div class="seasons-form-row">
        <div class="seasons-form-group">
          <label for="sourceMalla" class="seasons-form-label">Malla Origen</label>
          <select
            id="sourceMalla"
            formControlName="sourceMalla"
            class="seasons-form-control">
            <option value="">Seleccione malla origen</option>
            <option *ngFor="let malla of mallas" [value]="malla.idMalla">{{ malla.detalle }}</option>
          </select>
        </div>
        <div class="seasons-form-group">
          <label for="targetMalla" class="seasons-form-label">Malla Destino</label>
          <select
            id="targetMalla"
            formControlName="targetMalla"
            class="seasons-form-control">
            <option value="">Seleccione malla destino</option>
            <option *ngFor="let malla of mallas" [value]="malla.idMalla">{{ malla.detalle }}</option>
          </select>
        </div>
      </div>
      <div class="seasons-form-actions">
        <p-button label="Cancelar" icon="pi pi-times" type="button" (onClick)="hideReplicateDialog()" class="p-button-secondary p-button-outlined"></p-button>
        <p-button label="Replicar" icon="pi pi-clone" type="submit" [disabled]="!replicateForm.valid" class="p-button-info"></p-button>
      </div>
    </form>
  </div>
</p-dialog>

<!-- Modal de confirmación para eliminar -->
<app-confirmation-modal
  [visible]="showConfirmDelete"
  title="Confirmar Eliminación"
  message="¿Está seguro de que desea eliminar esta relación malla-requisito?"
  (accept)="deleteMallaRequisito()"
  (reject)="cancelDelete()">
</app-confirmation-modal>

<p-toast></p-toast>
