<div class="seasons-container">
  <div class="seasons-header">
    <div class="seasons-header-content">
      <div class="seasons-header-title">
        <h1>Gestión de Mallas</h1>
        <p>Aquí se gestionarán las mallas curriculares relacionadas con cursos y tipos de oferta.</p>
      </div>
      <div class="seasons-header-actions">
        <p-button label="Agregar Malla" icon="pi pi-plus" (onClick)="openCreateDialog()" styleClass="p-button-primary p-button-lg"></p-button>
      </div>
    </div>
  </div>

  <div class="seasons-content-card">
    <p-table [value]="mallas" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
             currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} mallas">
      <ng-template pTemplate="header">
        <tr>
          <th>Detalle</th>
          <th>Curso</th>
          <th>Tipo de Oferta</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-malla>
        <tr>
          <td>{{ malla.detalle }}</td>
          <td>{{ getCursoName(malla.idCursos!) }}</td>
          <td>{{ getTipoOfertaName(malla.idTipoOferta!) }}</td>
          <td class="seasons-actions-cell">
            <p-button icon="pi pi-pencil" (onClick)="openEditDialog(malla)" pTooltip="Editar" tooltipPosition="top" styleClass="p-button-rounded p-button-text p-button-sm"></p-button>
            <p-button icon="pi pi-trash" (onClick)="confirmDelete(malla)" pTooltip="Eliminar" tooltipPosition="top" styleClass="p-button-rounded p-button-text p-button-sm"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4">No hay mallas registradas.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Dialog para crear/editar malla -->
<p-dialog [(visible)]="displayDialog" [modal]="true" [style]="{width: '600px'}" [header]="isEditing ? 'Editar Malla' : 'Crear Malla'"
          (onHide)="hideDialog()" [draggable]="false" [resizable]="false" styleClass="p-dialog-custom">
  <div class="seasons-dialog-content">
    <form [formGroup]="mallaForm" (ngSubmit)="saveMalla()" class="seasons-form-grid">
      <div class="seasons-form-row">
        <div class="seasons-form-group">
          <label for="detalle" class="seasons-form-label">Detalle</label>
          <input pInputText id="detalle" formControlName="detalle" class="seasons-form-control" />
        </div>
      </div>
      <div class="seasons-form-row">
        <div class="seasons-form-group">
          <label for="idCursos" class="seasons-form-label">Curso</label>
          <select id="idCursos" formControlName="idCursos" class="seasons-form-control">
            <option value="">Seleccione un curso</option>
            <option *ngFor="let curso of cursos" [value]="curso.idCursos">{{ curso.detalle }}</option>
          </select>
        </div>
        <div class="seasons-form-group">
          <label for="idTipoOferta" class="seasons-form-label">Tipo de Oferta</label>
          <select id="idTipoOferta" formControlName="idTipoOferta" class="seasons-form-control">
            <option value="">Seleccione un tipo de oferta</option>
            <option *ngFor="let tipo of tiposOferta" [value]="tipo.idtipoOferta">{{ tipo.detalle }}</option>
          </select>
        </div>
      </div>
      <div class="seasons-form-actions">
        <p-button label="Cancelar" icon="pi pi-times" type="button" (onClick)="displayDialog = false" class="p-button-secondary p-button-outlined"></p-button>
        <p-button label="Guardar" icon="pi pi-check" type="submit" [disabled]="!mallaForm.valid" class="p-button-primary"></p-button>
      </div>
    </form>
  </div>
</p-dialog>

<!-- Modal de confirmación para eliminar -->
<app-confirmation-modal
  [visible]="showConfirmDelete"
  title="Confirmar Eliminación"
  message="¿Está seguro de que desea eliminar esta malla?"
  acceptLabel="Eliminar"
  rejectLabel="Cancelar"
  (accept)="deleteMalla()"
  (reject)="cancelDelete()"
  (hide)="cancelDelete()">
</app-confirmation-modal>

<p-toast></p-toast>
