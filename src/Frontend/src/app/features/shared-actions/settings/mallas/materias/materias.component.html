<div class="seasons-container">
  <div class="seasons-header">
    <div class="seasons-header-content">
      <div class="seasons-header-title">
        <h1>Gestión de Materias</h1>
        <p>Aquí se gestionarán las materias del sistema educativo.</p>
      </div>
      <div class="seasons-header-actions">
        <p-button label="Agregar Materia" icon="pi pi-plus" (onClick)="openCreateDialog()" styleClass="p-button-primary p-button-lg"></p-button>
      </div>
    </div>
  </div>

  <div class="seasons-content-card">
    <p-table [value]="materias" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
             currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} materias">
      <ng-template pTemplate="header">
        <tr>
          <th>Detalle</th>
          <th>Horas Requeridas</th>
          <th>Activo</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-materia>
        <tr>
          <td>{{ materia.detalle }}</td>
          <td>{{ materia.horasRequeridas }}</td>
          <td>{{ materia.esActivo ? 'Sí' : 'No' }}</td>
          <td class="seasons-actions-cell">
            <p-button icon="pi pi-pencil" (onClick)="openEditDialog(materia)" pTooltip="Editar" tooltipPosition="top" styleClass="p-button-rounded p-button-text p-button-sm"></p-button>
            <p-button icon="pi pi-trash" (onClick)="confirmDelete(materia)" pTooltip="Eliminar" tooltipPosition="top" styleClass="p-button-rounded p-button-text p-button-sm"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4">No hay materias registradas.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Dialog para crear/editar materia -->
<p-dialog [(visible)]="displayDialog" [modal]="true" [style]="{width: '600px'}" [header]="isEditing ? 'Editar Materia' : 'Crear Materia'"
          (onHide)="hideDialog()" [draggable]="false" [resizable]="false" styleClass="p-dialog-custom">
  <div class="seasons-dialog-content">
    <form [formGroup]="materiaForm" (ngSubmit)="saveMateria()" class="seasons-form-grid">
      <div class="seasons-form-row">
        <div class="seasons-form-group">
          <label for="detalle" class="seasons-form-label">Detalle</label>
          <input pInputText id="detalle" formControlName="detalle" class="seasons-form-control" />
        </div>
      </div>
      <div class="seasons-form-row">
        <div class="seasons-form-group">
          <label for="horasRequeridas" class="seasons-form-label">Horas Requeridas</label>
          <p-inputNumber id="horasRequeridas" formControlName="horasRequeridas" placeholder="Horas"></p-inputNumber>
        </div>
        <div class="seasons-form-group">
          <label for="esActivo" class="seasons-form-label">Activo</label>
          <p-toggleButton formControlName="esActivo" onLabel="Activo" offLabel="Inactivo"></p-toggleButton>
        </div>
      </div>
      <div class="seasons-form-actions">
        <p-button label="Cancelar" icon="pi pi-times" type="button" (onClick)="displayDialog = false" class="p-button-secondary p-button-outlined"></p-button>
        <p-button label="Guardar" icon="pi pi-check" type="submit" [disabled]="!materiaForm.valid" class="p-button-primary"></p-button>
      </div>
    </form>
  </div>
</p-dialog>

<!-- Modal de confirmación para eliminar -->
<app-confirmation-modal
  [visible]="showConfirmDelete"
  title="Confirmar Eliminación"
  message="¿Está seguro de que desea eliminar esta materia?"
  acceptLabel="Eliminar"
  rejectLabel="Cancelar"
  (accept)="deleteMateria()"
  (reject)="cancelDelete()"
  (hide)="cancelDelete()">
</app-confirmation-modal>

<p-toast></p-toast>
