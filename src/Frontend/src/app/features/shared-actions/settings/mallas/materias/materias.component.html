<div class="seasons-container">
  <!-- Header -->
  <div class="settings-header">
    <div class="seasons-header-title">
      <h1>Gestión de Materias</h1>
      <p>Aquí se gestionarán las materias del sistema educativo.</p>
    </div>
    <p-button label="Nueva Materia" icon="pi pi-plus" (onClick)="openCreateDialog()" styleClass="btn-nuevo"></p-button>
  </div>

  <div class="seasons-content-card">
    <p-table [value]="materias" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
             currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} materias">
      <ng-template pTemplate="header">
        <tr>
          <th>Detalle</th>
          <th>Horas Requeridas</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-materia>
        <tr>
          <td class="col-primary">{{ materia.detalle }}</td>
          <td>{{ materia.horasRequeridas }} h</td>
          <td>
            <p-tag [value]="materia.esActivo ? 'Activo' : 'Inactivo'"
                   [severity]="materia.esActivo ? 'success' : 'secondary'"></p-tag>
          </td>
          <td class="seasons-actions-cell" style="justify-content:center">
            <p-button icon="pi pi-pencil" (onClick)="openEditDialog(materia)" pTooltip="Editar" tooltipPosition="top" styleClass="p-button-text p-button-rounded btn-edit p-button-sm"></p-button>
            <p-button icon="pi pi-trash" (onClick)="confirmDelete(materia)" pTooltip="Eliminar" tooltipPosition="top" styleClass="p-button-text p-button-rounded btn-delete p-button-sm"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4">
            <div style="text-align:center; padding:3rem 1rem; color:var(--text-color-secondary)">
              <i class="pi pi-inbox" style="font-size:2rem; display:block; margin-bottom:0.5rem"></i>
              No hay materias registradas aún.
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Dialog crear/editar materia -->
<p-dialog [(visible)]="displayDialog" [modal]="true" [style]="{width: '480px'}"
          [header]="isEditing ? 'Editar Materia' : 'Nueva Materia'"
          (onHide)="hideDialog()" [draggable]="false" [resizable]="false">
  <form [formGroup]="materiaForm">
    <div class="p-fluid formgrid grid" style="padding-top: 0.5rem;">

      <div class="field col-12">
        <label class="font-semibold block mb-2">Nombre de la Materia <span class="text-red-400">*</span></label>
        <input pInputText formControlName="detalle" placeholder="Ej: Matemáticas I" class="seasons-form-control w-full" />
      </div>

      <div class="field col-12">
        <label class="font-semibold block mb-2">Horas Requeridas <span class="text-red-400">*</span></label>
        <p-inputNumber formControlName="horasRequeridas" placeholder="Nº de horas" [min]="1" [showButtons]="true" style="width:100%" ></p-inputNumber>
      </div>

   
    </div>
  </form>
  <ng-template pTemplate="footer">
    <p-button label="Cancelar" icon="pi pi-times" (onClick)="hideDialog()" [text]="true" severity="secondary"></p-button>
    <p-button label="Guardar" icon="pi pi-check" (onClick)="saveMateria()" [disabled]="!materiaForm.valid"></p-button>
  </ng-template>
</p-dialog>

<!-- Modal de confirmación para eliminar -->
<app-confirmation-modal
  [visible]="showConfirmDelete"
  title="Confirmar Eliminación"
  message="¿Está seguro de que desea eliminar esta materia?"
  acceptLabel="Eliminar"
  rejectLabel="Cancelar"
  (accept)="deleteMateria()"
  (reject)="cancelDelete()"
  (hide)="cancelDelete()">
</app-confirmation-modal>

<app-shared-toast></app-shared-toast>
