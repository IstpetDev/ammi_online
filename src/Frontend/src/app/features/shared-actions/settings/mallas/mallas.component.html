<div class="settings-page">

  <div class="mb-4">
    <p-button
      label="Volver a Configuraciones Cíclicas"
      icon="pi pi-arrow-left"
      severity="secondary"
      routerLink="/dashboard/cyclic-configurations">
    </p-button>
  </div>

  <nav class="settings-tabs">
    <button class="settings-tab" [class.active]="activeTab === 'cursos'" (click)="setActiveTab('cursos')">
      <i class="pi pi-graduation-cap"></i>
      Cursos
    </button>
    <button class="settings-tab" [class.active]="activeTab === 'tipo-oferta'" (click)="setActiveTab('tipo-oferta')">
      <i class="pi pi-tag"></i>
      Tipo de Oferta
    </button>
    <button class="settings-tab" [class.active]="activeTab === 'materias'" (click)="setActiveTab('materias')">
      <i class="pi pi-book"></i>
      Materias
    </button>
    <button class="settings-tab" [class.active]="activeTab === 'especialidades'" (click)="setActiveTab('especialidades')">
      <i class="pi pi-sitemap"></i>
      Especialidades
    </button>
    <button class="settings-tab" [class.active]="activeTab === 'requisitos'" (click)="setActiveTab('requisitos')">
      <i class="pi pi-list-check"></i>
      Requisitos
    </button>
    <button class="settings-tab" [class.active]="activeTab === 'beneficios'" (click)="setActiveTab('beneficios')">
      <i class="pi pi-tags"></i>
      Beneficios
    </button>
  </nav>

  <div>
    <app-cursos *ngIf="activeTab === 'cursos'"></app-cursos>
    <app-tipo-oferta *ngIf="activeTab === 'tipo-oferta'"></app-tipo-oferta>
    <app-materias *ngIf="activeTab === 'materias'"></app-materias>
    <app-especialidades *ngIf="activeTab === 'especialidades'"></app-especialidades>
    <app-requisitos *ngIf="activeTab === 'requisitos'"></app-requisitos>
    <app-beneficios *ngIf="activeTab === 'beneficios'"></app-beneficios>
  </div>

</div>
