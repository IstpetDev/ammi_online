<div class="seasons-container">
  <!-- Header -->
  <div class="settings-header">
    <div class="seasons-header-title">
      <h1>Gestión de Especialidades</h1>
      <p>Aquí se gestionarán las especialidades del sistema educativo.</p>
    </div>
    <p-button label="Nueva Especialidad" icon="pi pi-plus" (onClick)="openCreateDialog()" styleClass="btn-nuevo"></p-button>
  </div>

  <div class="seasons-content-card">
    <p-table [value]="especialidades" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
             currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} especialidades">
      <ng-template pTemplate="header">
        <tr>
          <th>Detalle</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-especialidad>
        <tr>
          <td class="col-primary">{{ especialidad.detalle }}</td>
          <td class="seasons-actions-cell" style="justify-content:center">
            <p-button icon="pi pi-pencil" (onClick)="openEditDialog(especialidad)" pTooltip="Editar" tooltipPosition="top" styleClass="p-button-text p-button-rounded btn-edit p-button-sm"></p-button>
            <p-button icon="pi pi-trash" (onClick)="confirmDelete(especialidad)" pTooltip="Eliminar" tooltipPosition="top" styleClass="p-button-text p-button-rounded btn-delete p-button-sm"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="2">
            <div style="text-align:center; padding:3rem 1rem; color:var(--text-color-secondary)">
              <i class="pi pi-inbox" style="font-size:2rem; display:block; margin-bottom:0.5rem"></i>
              No hay especialidades registradas aún.
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Dialog para crear/editar especialidad -->
<p-dialog [(visible)]="displayDialog" [modal]="true" [style]="{width: '440px'}" [header]="isEditing ? 'Editar Especialidad' : 'Nueva Especialidad'"
          (onHide)="hideDialog()" [draggable]="false" [resizable]="false">
  <form [formGroup]="especialidadForm">

      <div class="field">
        <label class="font-semibold block mb-2">Detalle <span class="text-red-400">*</span></label>
        <input pInputText formControlName="Detalle" placeholder="Nombre de la especialidad" class="seasons-form-control w-full" />
      </div>

  </form>
  <ng-template pTemplate="footer">
    <p-button label="Cancelar" icon="pi pi-times" (onClick)="hideDialog()" [text]="true" severity="secondary"></p-button>
    <p-button label="Guardar" icon="pi pi-check" (onClick)="saveEspecialidad()" [disabled]="!especialidadForm.valid"></p-button>
  </ng-template>
</p-dialog>

<!-- Modal de confirmación para eliminar -->
<app-confirmation-modal
  [visible]="showConfirmDelete"
  title="Confirmar Eliminación"
  message="¿Está seguro de que desea eliminar esta especialidad?"
  acceptLabel="Eliminar"
  rejectLabel="Cancelar"
  (accept)="deleteEspecialidad()"
  (reject)="cancelDelete()"
  (hide)="cancelDelete()">
</app-confirmation-modal>

<app-shared-toast></app-shared-toast>
