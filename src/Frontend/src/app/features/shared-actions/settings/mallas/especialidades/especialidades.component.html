<div class="seasons-container">
  <div class="seasons-header">
    <div class="seasons-header-content">
      <div class="seasons-header-title">
        <h1>Gestión de Especialidades</h1>
        <p>Aquí se gestionarán las especialidades del sistema educativo.</p>
      </div>
      <div class="seasons-header-actions">
        <p-button label="Agregar Especialidad" icon="pi pi-plus" (onClick)="openCreateDialog()" styleClass="p-button-primary p-button-lg"></p-button>
      </div>
    </div>
  </div>

  <div class="seasons-content-card">
    <p-table [value]="especialidades" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
             currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} especialidades">
      <ng-template pTemplate="header">
        <tr>
          <th>Detalle</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-especialidad>
        <tr>
          <td>{{ especialidad.detalle }}</td>
          <td class="seasons-actions-cell">
            <p-button icon="pi pi-pencil" (onClick)="openEditDialog(especialidad)" pTooltip="Editar" tooltipPosition="top" styleClass="p-button-rounded p-button-text p-button-sm"></p-button>
            <p-button icon="pi pi-trash" (onClick)="confirmDelete(especialidad)" pTooltip="Eliminar" tooltipPosition="top" styleClass="p-button-rounded p-button-text p-button-sm"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="2">No hay especialidades registradas.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Dialog para crear/editar especialidad -->
<p-dialog [(visible)]="displayDialog" [modal]="true" [style]="{width: '600px'}" [header]="isEditing ? 'Editar Especialidad' : 'Crear Especialidad'"
          (onHide)="hideDialog()" [draggable]="false" [resizable]="false" styleClass="p-dialog-custom">
  <div class="seasons-dialog-content">
    <form [formGroup]="especialidadForm" (ngSubmit)="saveEspecialidad()" class="seasons-form-grid">
      <div class="seasons-form-row">
        <div class="seasons-form-group">
          <label for="Detalle" class="seasons-form-label">Detalle</label>
          <input pInputText id="Detalle" formControlName="Detalle" class="seasons-form-control" />
        </div>
      </div>
      <div class="seasons-form-actions">
        <p-button label="Cancelar" icon="pi pi-times" type="button" (onClick)="displayDialog = false" class="p-button-secondary p-button-outlined"></p-button>
        <p-button label="Guardar" icon="pi pi-check" type="submit" [disabled]="!especialidadForm.valid" class="p-button-primary"></p-button>
      </div>
    </form>
  </div>
</p-dialog>

<!-- Modal de confirmación para eliminar -->
<app-confirmation-modal
  [visible]="showConfirmDelete"
  title="Confirmar Eliminación"
  message="¿Está seguro de que desea eliminar esta especialidad?"
  acceptLabel="Eliminar"
  rejectLabel="Cancelar"
  (accept)="deleteEspecialidad()"
  (reject)="cancelDelete()"
  (hide)="cancelDelete()">
</app-confirmation-modal>

<p-toast></p-toast>
