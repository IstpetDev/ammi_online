<div class="seasons-container">
  <!-- Header -->
  <div class="settings-header">
    <div class="seasons-header-title">
      <h1>Gestión de Tipos de Oferta</h1>
      <p>Aquí se gestionarán los tipos de oferta académica.</p>
    </div>
    <p-button label="Nuevo Tipo de Oferta" icon="pi pi-plus" (onClick)="openCreateDialog()"
      styleClass="btn-nuevo"></p-button>
  </div>

  <div class="seasons-content-card">
    <p-table [value]="tiposOferta" styleClass="tipo-oferta-table" [paginator]="true" paginatorPosition="bottom"
      [scrollable]="true" scrollHeight="flex" [rows]="10" [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} tipos de oferta">
      <ng-template pTemplate="header">
        <tr>
          <th style="width:100%">Detalle</th>
          <th>Meses diferibles</th>
          <th style="display:none">Activo</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-tipoOferta>
        <tr>
          <td class="col-primary" style="width:100%">{{ tipoOferta.detalle }}</td>
          <td>{{ tipoOferta.duracion ?? 0 }} meses</td>
          <td style="display:none"></td>
          <td class="seasons-actions-cell" style="justify-content:center">
            <p-button icon="pi pi-pencil" (onClick)="openEditDialog(tipoOferta)" pTooltip="Editar" tooltipPosition="top"
              styleClass="p-button-text p-button-rounded btn-edit p-button-sm"></p-button>
            <p-button icon="pi pi-ban" (onClick)="toggleActivo(tipoOferta)" pTooltip="Desactivar/Activar" tooltipPosition="top"
              styleClass="p-button-text p-button-rounded btn-action p-button-sm"></p-button>
            <p-button icon="pi pi-trash" (onClick)="confirmDelete(tipoOferta)" pTooltip="Eliminar" tooltipPosition="top"
              styleClass="p-button-text p-button-rounded btn-delete p-button-sm"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3" class="emptymessage-spacer">
            &nbsp;
          </td>
        </tr>
      </ng-template>
    </p-table>

    <div class="empty-overlay" *ngIf="!tiposOferta?.length">
      <i class="pi pi-inbox"></i>
      <span>No hay tipos de oferta registrados aún.</span>
    </div>
  </div>
</div>

<!-- Dialog crear/editar tipo de oferta -->
<p-dialog [(visible)]="displayDialog" [modal]="true" [style]="{width: '440px'}"
  [header]="isEditing ? 'Editar Tipo de Oferta' : 'Nuevo Tipo de Oferta'" (onHide)="hideDialog()" [draggable]="false"
  [resizable]="false">
  <form [formGroup]="tipoOfertaForm">
    <div class="p-fluid formgrid grid" style="padding-top: 0.5rem;">

      <div class="field col-12">
        <label class="font-semibold block mb-2">Detalle <span class="text-red-400">*</span></label>
        <input pInputText formControlName="detalle" placeholder="Nombre del tipo de oferta" style="width:100%" class="seasons-form-control" />
      </div>

      <div class="field col-12">
        <label class="font-semibold block mb-2">Duración (meses diferibles) <span class="text-red-400">*</span></label>
        <p-inputNumber formControlName="duracion" placeholder="Límite de meses diferibles" [min]="0" [showButtons]="true" style="width:100%" ></p-inputNumber>
      </div>

      <!-- Estado oculto, siempre inactivo por defecto en el form -->
      <input type="hidden" formControlName="esActivo" />

    </div>
  </form>
  <ng-template pTemplate="footer">
    <p-button label="Cancelar" icon="pi pi-times" (onClick)="hideDialog()" [text]="true"
      severity="secondary"></p-button>
    <p-button label="Guardar" icon="pi pi-check" (onClick)="saveTipoOferta()"
      [disabled]="!tipoOfertaForm.valid"></p-button>
  </ng-template>
</p-dialog>

<!-- Modal de confirmación para eliminar -->
<app-confirmation-modal [visible]="showConfirmDelete" title="Confirmar Eliminación"
  message="¿Está seguro de que desea eliminar este tipo de oferta?" acceptLabel="Eliminar" rejectLabel="Cancelar"
  (accept)="deleteTipoOferta()" (reject)="cancelDelete()" (hide)="cancelDelete()">
</app-confirmation-modal>

<app-shared-toast></app-shared-toast>
