<div class="seasons-container">
  <div class="seasons-header">
    <div class="seasons-header-content">
      <div class="seasons-header-title">
        <h1>Gestión de Cursos</h1>
        <p>Aquí se gestionarán los cursos relacionados con especialidades.</p>
      </div>
      <div class="seasons-header-actions">
        <p-button label="Agregar Curso" icon="pi pi-plus" (onClick)="openCreateDialog()" styleClass="p-button-primary p-button-lg"></p-button>
      </div>
    </div>
  </div>

  <div class="seasons-content-card">
    <p-table [value]="cursos" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
             currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} cursos">
      <ng-template pTemplate="header">
        <tr>
          <th>Detalle</th>
          <th>Especialidad</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-curso>
        <tr>
          <td>{{ curso.detalle }}</td>
          <td>{{ getEspecialidadName(curso.idEspecialidad!) }}</td>
          <td class="seasons-actions-cell">
            <p-button icon="pi pi-pencil" (onClick)="openEditDialog(curso)" pTooltip="Editar" tooltipPosition="top" styleClass="p-button-rounded p-button-text p-button-sm"></p-button>
            <p-button icon="pi pi-trash" (onClick)="confirmDelete(curso)" pTooltip="Eliminar" tooltipPosition="top" styleClass="p-button-rounded p-button-text p-button-sm"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3">No hay cursos registrados.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Dialog para crear/editar curso -->
<p-dialog [(visible)]="displayDialog" [modal]="true" [style]="{width: '600px'}" [header]="isEditing ? 'Editar Curso' : 'Crear Curso'"
          (onHide)="hideDialog()" [draggable]="false" [resizable]="false" styleClass="p-dialog-custom">
  <div class="seasons-dialog-content">
    <form [formGroup]="cursoForm" (ngSubmit)="saveCurso()" class="seasons-form-grid">
      <div class="seasons-form-row">
        <div class="seasons-form-group">
          <label for="detalle" class="seasons-form-label">Detalle</label>
          <input pInputText id="detalle" formControlName="detalle" class="seasons-form-control" />
        </div>
      </div>
      <div class="seasons-form-row">
        <div class="seasons-form-group">
          <label for="idEspecialidad" class="seasons-form-label">Especialidad</label>
          <select id="idEspecialidad" formControlName="idEspecialidad" class="seasons-form-control">
            <option value="">Seleccione una especialidad</option>
            <option *ngFor="let especialidad of especialidades" [value]="especialidad.idEspecialidad">{{ especialidad.detalle }}</option>
          </select>
        </div>
      </div>
      <div class="seasons-form-actions">
        <p-button label="Cancelar" icon="pi pi-times" type="button" (onClick)="displayDialog = false" class="p-button-secondary p-button-outlined"></p-button>
        <p-button label="Guardar" icon="pi pi-check" type="submit" [disabled]="!cursoForm.valid" class="p-button-primary"></p-button>
      </div>
    </form>
  </div>
</p-dialog>

<!-- Modal de confirmación para eliminar -->
<app-confirmation-modal
  [visible]="showConfirmDelete"
  title="Confirmar Eliminación"
  message="¿Está seguro de que desea eliminar este curso?"
  acceptLabel="Eliminar"
  rejectLabel="Cancelar"
  (accept)="deleteCurso()"
  (reject)="cancelDelete()"
  (hide)="cancelDelete()">
</app-confirmation-modal>

<p-toast></p-toast>
