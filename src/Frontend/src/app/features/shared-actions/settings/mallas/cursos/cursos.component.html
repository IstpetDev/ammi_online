<div class="seasons-container">
  <!-- Header -->
  <div class="settings-header">
    <div class="seasons-header-title">
      <h1>Gestión de Cursos</h1>
      <p>Aquí se gestionarán los cursos relacionados con especialidades.</p>
    </div>
    <p-button label="Nuevo Curso" icon="pi pi-plus" (onClick)="openCreateDialog()" styleClass="btn-nuevo"></p-button>
  </div>

  <div class="seasons-content-card">
    <p-table [value]="cursos" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} cursos">
      <ng-template pTemplate="header">
        <tr>
          <th>Detalle</th>
          <th>Especialidad</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-curso>
        <tr>
          <td class="col-primary">{{ curso.detalle }}</td>
          <td>{{ getEspecialidadName(curso.idEspecialidad!) }}</td>
          <td class="seasons-actions-cell" style="justify-content:center">
            <p-button icon="pi pi-pencil" (onClick)="openEditDialog(curso)" pTooltip="Editar" tooltipPosition="top"
              styleClass="p-button-text p-button-rounded btn-edit p-button-sm"></p-button>
            <p-button icon="pi pi-trash" (onClick)="confirmDelete(curso)" pTooltip="Eliminar" tooltipPosition="top"
              styleClass="p-button-text p-button-rounded btn-delete p-button-sm"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3">
            <div style="text-align:center; padding:3rem 1rem; color:var(--text-color-secondary)">
              <i class="pi pi-inbox" style="font-size:2rem; display:block; margin-bottom:0.5rem"></i>
              No hay cursos registrados aún.
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Dialog para crear/editar curso -->
<p-dialog [(visible)]="displayDialog" [modal]="true" [style]="{width: '480px'}"
  [header]="isEditing ? 'Editar Curso' : 'Nuevo Curso'" (onHide)="hideDialog()" [draggable]="false" [resizable]="false">
  <form [formGroup]="cursoForm">
    <div class="p-fluid formgrid grid" style="padding-top: 0.5rem;">

      <div class="field col-12">
        <label class="font-semibold block mb-2" style="min-width: 100%;">Detalle <span class="text-red-400">*</span></label>
        <input pInputText formControlName="detalle" placeholder="Nombre del curso" />
      </div>

      <div class="field col-12">
        <label class="font-semibold block mb-2">Especialidad <span class="text-red-400">*</span></label>
        <p-select formControlName="idEspecialidad" [options]="especialidades" optionLabel="detalle"
          optionValue="idEspecialidad" placeholder="Seleccione una especialidad" appendTo="body"
          styleClass="w-full"></p-select>
      </div>

    </div>
  </form>
  <ng-template pTemplate="footer">
    <p-button label="Cancelar" icon="pi pi-times" (onClick)="hideDialog()" [text]="true"
      severity="secondary"></p-button>
    <p-button label="Guardar" icon="pi pi-check" (onClick)="saveCurso()" [disabled]="!cursoForm.valid"></p-button>
  </ng-template>
</p-dialog>

<!-- Modal de confirmación para eliminar -->
<app-confirmation-modal [visible]="showConfirmDelete" title="Confirmar Eliminación"
  message="¿Está seguro de que desea eliminar este curso?" acceptLabel="Eliminar" rejectLabel="Cancelar"
  (accept)="deleteCurso()" (reject)="cancelDelete()" (hide)="cancelDelete()">
</app-confirmation-modal>

<app-shared-toast></app-shared-toast>
