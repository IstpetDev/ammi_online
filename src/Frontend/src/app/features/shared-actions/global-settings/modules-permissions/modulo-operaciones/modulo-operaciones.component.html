<div class="seasons-container">
  <div class="seasons-header">
    <div class="seasons-header-content">
      <div class="seasons-header-title">
        <h1>Módulo Operaciones</h1>
        <p>Aquí se gestionarán las operaciones asociadas a los módulos del sistema.</p>
      </div>
      <div class="seasons-header-actions">
        <p-button label="Nuevo" icon="pi pi-plus" (onClick)="openNewModuloOperacionDialog()" styleClass="p-button-primary p-button-lg"></p-button>
      </div>
    </div>
  </div>

  <div class="seasons-content-card">
    <p-table [value]="moduloOperaciones" [loading]="loading" styleClass="p-datatable-striped">
      <ng-template pTemplate="header">
        <tr>
          <th>Módulo</th>
          <th>Operación</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-mo>
        <tr>
          <td>{{ getModuloName(mo.idModulo) }}</td>
          <td>{{ getOperacionName(mo.idOperacion) }}</td>
          <td>
            <p-button icon="pi pi-pencil" (onClick)="editModuloOperacion(mo)" class="p-button-rounded p-button-success p-mr-2"></p-button>
            <p-button icon="pi pi-trash" (onClick)="deleteModuloOperacion(mo)" class="p-button-rounded p-button-danger"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog [(visible)]="moduloOperacionDialog" [modal]="true" header="Módulo Operación" styleClass="p-dialog-custom">
  <form class="seasons-form-grid">
    <div class="seasons-form-row">
      <div class="seasons-form-group">
        <label class="seasons-form-label">Módulo</label>
        <select id="modulo" [(ngModel)]="moduloOperacion.idModulo" class="seasons-form-control">
          <option *ngFor="let mod of modulos" [value]="mod.idModulo">{{ mod.detalle }}</option>
        </select>
      </div>
    </div>
    <div class="seasons-form-row">
      <div class="seasons-form-group">
        <label class="seasons-form-label">Operación</label>
        <select id="operacion" [(ngModel)]="moduloOperacion.idOperacion" class="seasons-form-control">
          <option value="1">CREAR</option>
          <option value="2">LEER</option>
          <option value="3">MODIFICAR</option>
          <option value="4">ELIMINAR</option>
        </select>
      </div>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <div class="seasons-form-actions">
      <p-button label="Cancelar" icon="pi pi-times" (onClick)="hideModuloOperacionDialog()" styleClass="p-button-secondary"></p-button>
      <p-button label="Guardar" icon="pi pi-check" (onClick)="saveModuloOperacion()" styleClass="p-button-primary"></p-button>
    </div>
  </ng-template>
</p-dialog>

<app-shared-toast></app-shared-toast>
