<div class="settings-page">

  <nav class="settings-tabs">
    <button class="settings-tab" [class.active]="activeTab === 'roles'" (click)="setActiveTab('roles')">
      <i class="pi pi-shield"></i>
      Gestión Roles
    </button>
    <button class="settings-tab" [class.active]="activeTab === 'asignaciones'" (click)="setActiveTab('asignaciones')">
      <i class="pi pi-lock"></i>
      Asignaciones de Módulos a Rol
    </button>
  </nav>

  <div>
    <app-roles *ngIf="activeTab === 'roles'"></app-roles>
    <app-rol-modulo-operaciones *ngIf="activeTab === 'asignaciones'"></app-rol-modulo-operaciones>
  </div>

</div>
