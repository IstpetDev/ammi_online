<div class="seasons-container">
  <!-- Header -->
  <div class="settings-header">
    <div class="seasons-header-title">
      <h1>Gestión de Roles</h1>
      <p>Aquí se gestionarán los roles del sistema.</p>
    </div>
    <p-button label="Nuevo Rol" icon="pi pi-plus" (onClick)="openNewRoleDialog()" styleClass="btn-nuevo"></p-button>
  </div>

  <div class="seasons-content-card">
    <p-table [value]="roles" [loading]="loading">
      <ng-template pTemplate="header">
        <tr>
          <th>Detalle</th>
          <th style="width: 90px; text-align:center">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-role>
        <tr>
          <td class="col-primary">{{ role.detalle }}</td>
          <td class="seasons-actions-cell" style="justify-content:center">
            <p-button icon="pi pi-pencil" (onClick)="editRole(role)" pTooltip="Editar" tooltipPosition="top" styleClass="p-button-text p-button-rounded btn-edit p-button-sm"></p-button>
            <p-button icon="pi pi-trash" (onClick)="deleteRole(role)" pTooltip="Eliminar" tooltipPosition="top" styleClass="p-button-text p-button-rounded btn-delete p-button-sm"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="2">
            <div style="text-align:center; padding:3rem 1rem; color:var(--text-color-secondary)">
              <i class="pi pi-inbox" style="font-size:2rem; display:block; margin-bottom:0.5rem"></i>
              No hay roles registrados aún.
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog [(visible)]="roleDialog" [modal]="true" header="Rol" styleClass="p-dialog-custom">
  <form class="seasons-form-grid">
    <div class="seasons-form-row">
      <div class="seasons-form-group">
        <label class="seasons-form-label">Detalle</label>
        <input pInputText id="detalle" [(ngModel)]="role.detalle" [ngModelOptions]="{standalone: true}" required class="seasons-form-control" />
      </div>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <div class="seasons-form-actions">
      <p-button label="Cancelar" icon="pi pi-times" (onClick)="hideRoleDialog()" styleClass="p-button-secondary"></p-button>
      <!-- Guardar: botón estilizado con los colores del sistema -->
      <p-button label="Guardar" icon="pi pi-check" (onClick)="saveRole()" styleClass="btn-guardar"></p-button>
    </div>
  </ng-template>
</p-dialog>

<app-shared-toast></app-shared-toast>
