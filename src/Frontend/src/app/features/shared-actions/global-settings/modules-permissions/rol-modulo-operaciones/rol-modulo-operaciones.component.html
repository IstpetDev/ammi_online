<div class="seasons-container">
  <div class="seasons-header">
    <div class="seasons-header-content">
      <div class="seasons-header-title">
        <h1>Rol Módulo Operaciones</h1>
        <p>Aquí se gestionarán las operaciones de módulos asignadas a los roles.</p>
      </div>
      <div class="seasons-header-actions">
        <p-button label="Nuevo" icon="pi pi-plus" (onClick)="openNewRolOperacionDialog()" styleClass="p-button-primary p-button-lg"></p-button>
      </div>
    </div>
  </div>

  <div class="seasons-content-card">
    <p-table [value]="rolOperaciones" [loading]="loading" styleClass="p-datatable-striped">
      <ng-template pTemplate="header">
        <tr>
          <th>Rol</th>
          <th>Módulo Operación</th>
          <th>Activo</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-ro>
        <tr>
          <td>{{ getRolName(ro.idRol) }}</td>
          <td>{{ getModuloOperacionName(ro.idModuloOperacion) }}</td>
          <td>{{ ro.esActivo ? 'Sí' : 'No' }}</td>
          <td>
            <p-button icon="pi pi-pencil" (onClick)="editRolOperacion(ro)" class="p-button-rounded p-button-success p-mr-2"></p-button>
            <p-button icon="pi pi-trash" (onClick)="deleteRolOperacion(ro)" class="p-button-rounded p-button-danger"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog [(visible)]="rolOperacionDialog" [modal]="true" header="Rol Operación" styleClass="p-dialog-custom">
  <form class="seasons-form-grid">
    <div class="seasons-form-row">
      <div class="seasons-form-group">
        <label class="seasons-form-label">Rol</label>
        <p-autoComplete [(ngModel)]="selectedRol" [suggestions]="filteredRoles" (completeMethod)="filterRoles($event)" [optionLabel]="'detalle'" placeholder="Buscar rol" style="width: 100%"></p-autoComplete>
      </div>
    </div>
    <div class="seasons-form-row">
      <div class="seasons-form-group">
        <label class="seasons-form-label">Módulo Operación</label>
        <select id="moduloOperacion" [(ngModel)]="rolOperacion.idModuloOperacion" class="seasons-form-control">
          <option *ngFor="let mo of moduloOperaciones" [value]="mo.idModuloOperacion">{{ getModuloOperacionName(mo.idModuloOperacion) }}</option>
        </select>
      </div>
    </div>
    <div class="seasons-form-row">
      <div class="seasons-form-group">
        <label class="seasons-form-label">Activo</label>
        <p-toggleButton [(ngModel)]="rolOperacion.esActivo" onLabel="Activo" offLabel="Inactivo"></p-toggleButton>
      </div>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <div class="seasons-form-actions">
      <p-button label="Cancelar" icon="pi pi-times" (onClick)="hideRolOperacionDialog()" styleClass="p-button-secondary"></p-button>
      <p-button label="Guardar" icon="pi pi-check" (onClick)="saveRolOperacion()" styleClass="p-button-primary"></p-button>
    </div>
  </ng-template>
</p-dialog>

<p-toast></p-toast>
