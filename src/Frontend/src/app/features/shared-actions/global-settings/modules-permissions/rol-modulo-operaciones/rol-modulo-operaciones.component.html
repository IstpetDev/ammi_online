<div class="seasons-container">
  <!-- Header -->
  <div class="settings-header">
    <div class="seasons-header-title">
      <h1>Rol Módulo Operaciones</h1>
      <p>Gestiona los permisos de cada módulo por rol usando los switches para activar/desactivar operaciones.</p>
    </div>
  </div>


  <!-- Selector de Rol en contenedor separado -->
  <div class="rol-selector-container mb-4">
    <div class="seasons-form-group">
      <label class="seasons-form-label">Seleccione un Rol</label>
      <p-select 
        [(ngModel)]="selectedRolId" 
        [options]="roles" 
        (ngModelChange)="onRolChange()"
        optionLabel="detalle"
        optionValue="idRol"
        placeholder="Seleccione un rol..." 
        [style]="{ width: '100%' }"
        [showClear]="true"
        class="rol-select-font">
      </p-select>
    </div>
    <button *ngIf="permisosPendientes.length > 0" pButton type="button" class="enviar-permisos-btn" (click)="enviarPermisos()">Enviar permisos</button>
  </div>

  <div class="seasons-content-card">
    <!-- Tabla de Permisos -->
    <div *ngIf="selectedRolId">
      <p-table [value]="groupedPermissions" [loading]="loading">
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 30%">Módulo</th>
            <th style="text-align: center; width: 17.5%">Crear</th>
            <th style="text-align: center; width: 17.5%">Leer</th>
            <th style="text-align: center; width: 17.5%">Modificar</th>
            <th style="text-align: center; width: 17.5%">Eliminar</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-permission>
          <tr>
            <td class="col-primary">{{ permission.moduloNombre }}</td>
            <td style="text-align: center">
              <p-checkbox 
                [(ngModel)]="permission.operaciones['CREAR'].enabled"
                (ngModelChange)="onPermissionChange(permission, 'CREAR')"
                [binary]="true"
                [disabled]="!permission.operaciones['CREAR'].idModuloOperacion">
              </p-checkbox>
            </td>
            <td style="text-align: center">
              <p-checkbox 
                [(ngModel)]="permission.operaciones['LEER'].enabled"
                (ngModelChange)="onPermissionChange(permission, 'LEER')"
                [binary]="true"
                [disabled]="!permission.operaciones['LEER'].idModuloOperacion">
              </p-checkbox>
            </td>
            <td style="text-align: center">
              <p-checkbox 
                [(ngModel)]="permission.operaciones['MODIFICAR'].enabled"
                (ngModelChange)="onPermissionChange(permission, 'MODIFICAR')"
                [binary]="true"
                [disabled]="!permission.operaciones['MODIFICAR'].idModuloOperacion">
              </p-checkbox>
            </td>
            <td style="text-align: center">
              <p-checkbox 
                [(ngModel)]="permission.operaciones['ELIMINAR'].enabled"
                (ngModelChange)="onPermissionChange(permission, 'ELIMINAR')"
                [binary]="true"
                [disabled]="!permission.operaciones['ELIMINAR'].idModuloOperacion">
              </p-checkbox>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5">
              <div style="text-align:center; padding:3rem 1rem; color:var(--text-color-secondary)">
                <i class="pi pi-inbox" style="font-size:2rem; display:block; margin-bottom:0.5rem"></i>
                No hay módulos disponibles.
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <!-- Mensaje cuando no hay rol seleccionado -->
    <div *ngIf="!selectedRolId" style="text-align:center; padding:3rem 1rem; color:var(--text-color-secondary)">
      <i class="pi pi-info-circle" style="font-size:2rem; display:block; margin-bottom:0.5rem"></i>
      <p style="font-size:1.1rem">Seleccione un rol para gestionar sus permisos</p>
    </div>
  </div>
</div>

<app-shared-toast></app-shared-toast>
