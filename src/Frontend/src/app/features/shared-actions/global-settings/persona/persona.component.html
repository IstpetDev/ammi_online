<div class="menu-container">
<p-toast></p-toast>
  <!-- Header Section -->
  <div class="page-header">
    <div class="header-content">

      <div class="title-section">
        <div class="title-icon">
          <i class="pi pi-users"></i>
        </div>
        <div>
          <h1 class="page-title">Gestión de Personas</h1>
          <p class="page-subtitle">Administrar personas y asignaciones de roles</p>
        </div>
      </div>

            <button pButton
              label="Volver"
              icon="pi pi-arrow-left"
              class="p-button-outlined"
              routerLink="/dashboard/configuraciones">
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="tabs">
      <button pButton [class.active]="activeTab === 'personas'" (click)="setActiveTab('personas')" label="Personas"></button>
      <button pButton [class.active]="activeTab === 'roles'" (click)="setActiveTab('roles')" label="Asignación de Roles"></button>
    </div>
    <div *ngIf="activeTab === 'personas'">
      <app-personas></app-personas>
    </div>
    <div *ngIf="activeTab === 'roles'">
      <app-asignacion-rol></app-asignacion-rol>
    </div>
  </div>
</div>
